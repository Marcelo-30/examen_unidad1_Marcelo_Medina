services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://laboratorio:laboratorio@mysql:3306/laboratorio
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: laboratorio
      MYSQL_USER: laboratorio
      MYSQL_PASSWORD: laboratorio
      MYSQL_ROOT_PASSWORD: laboratorio_root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u laboratorio -plaboratorio laboratorio -e 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
